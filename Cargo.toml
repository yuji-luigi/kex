[package]
name = "kex"
version = "0.1.0"
edition = "2024"
description = "Pull, review and run all the repos of a multi-repo project"
license = "Apache-2.0"
repository = "https://github.com/yuji-luigi/kex"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
ctrlc = "3.5.2"
dunce = "1.0.5"
inquire = "0.9.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-width = "0.2.3"
sha2 = "0.11.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "z"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
notify = "8.2.2"
